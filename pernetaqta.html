<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пернетақта</title>
<style>
  :root{
    --bg:#f4f7f7;
    --ink:#1b2a2e;
    --card:#ffffff;
    --key:#2f6f9e;
    --key-d:#22536f;
    --fn:#7a5aa8;
    --fn-d:#5c4285;
    --danger:#c94a3b;
    --muted:#5c6b6f;
    --focus:#ffd23f;
    --rowfocus:#ffe9a6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{height:100vh;width:100vw;display:flex;flex-direction:column;}

  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;flex:0 0 auto;gap:10px;
  }
  #cancelBtn{
    font-size:20px;font-weight:700;
    background:var(--card);border:3px solid #d8dede;border-radius:14px;
    padding:10px 18px;color:var(--ink);visibility:hidden;
  }
  #cancelBtn.show{visibility:visible;}
  #settingsBtn{
    width:46px;height:46px;border-radius:50%;
    background:var(--card);border:3px solid #d8dede;
    font-size:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);
  }

  /* text output */
  #outputWrap{flex:0 0 auto;padding:0 16px 8px;}
  #output{
    background:var(--card);border-radius:20px;
    min-height:90px;max-height:150px;overflow-y:auto;
    padding:16px 20px;
    font-size:42px;font-weight:700;line-height:1.25;
    word-wrap:break-word;
    border:3px solid #d8dede;
  }
  #output.empty{color:#a8b3b5;font-weight:600;font-size:28px;}

  /* keyboard grid */
  #kb{
    flex:1;display:flex;flex-direction:column;gap:8px;
    padding:0 12px 12px;
  }
  .kbrow{
    flex:1;display:flex;gap:8px;
    border-radius:16px;
    transition:background .1s;
  }
  .kbrow.rowscan{background:var(--rowfocus);}
  .key{
    flex:1;border:none;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;color:#fff;
    background:linear-gradient(180deg,var(--key),var(--key-d));
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .key.fn{
    background:linear-gradient(180deg,var(--fn),var(--fn-d));
    font-size:20px;
  }
  .key.fn.wide{flex:2.4;}
  .key.fn.danger{background:linear-gradient(180deg,var(--danger),#a3392c);}
  .key.colscan{
    outline:7px solid var(--focus);outline-offset:-3px;
    transform:scale(1.04);
  }

  /* settings */
  #settingsPanel{
    display:none;position:absolute;inset:0;z-index:30;
    background:rgba(20,30,32,0.6);align-items:center;justify-content:center;
  }
  #settingsPanel.active{display:flex;}
  #settingsCard{background:#fff;border-radius:26px;padding:30px;width:min(88vw,560px);}
  #settingsCard h2{margin:0 0 20px;font-size:26px;}
  .row2{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:14px;}
  .row2 label{font-size:19px;font-weight:600;}
  .toggle{display:flex;border-radius:16px;overflow:hidden;border:2px solid #d8dede;}
  .toggle button{padding:10px 16px;font-size:16px;font-weight:700;border:none;background:#fff;color:var(--muted);}
  .toggle button.active{background:var(--key);color:#fff;}
  input[type=range]{width:100%;}
  #closeSettings{
    margin-top:6px;width:100%;padding:14px;border-radius:14px;border:none;
    background:var(--key);color:#fff;font-size:18px;font-weight:700;
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <button id="cancelBtn">✕ Болдырмау</button>
    <div style="flex:1"></div>
    <button id="settingsBtn">⚙</button>
  </div>

  <div id="outputWrap">
    <div id="output" class="empty">Мәтін осында шығады...</div>
  </div>

  <div id="kb">
    <div class="kbrow">
      <button class="key" data-ch="А">А</button>
      <button class="key" data-ch="Б">Б</button>
      <button class="key" data-ch="В">В</button>
      <button class="key" data-ch="Г">Г</button>
      <button class="key" data-ch="Д">Д</button>
    </div>
    <div class="kbrow">
      <button class="key" data-ch="Е">Е</button>
      <button class="key" data-ch="Ж">Ж</button>
      <button class="key" data-ch="З">З</button>
      <button class="key" data-ch="И">И</button>
      <button class="key" data-ch="К">К</button>
    </div>
    <div class="kbrow">
      <button class="key" data-ch="Л">Л</button>
      <button class="key" data-ch="М">М</button>
      <button class="key" data-ch="Н">Н</button>
      <button class="key" data-ch="О">О</button>
    </div>
    <div class="kbrow">
      <button class="key" data-ch="П">П</button>
      <button class="key" data-ch="Р">Р</button>
      <button class="key" data-ch="С">С</button>
      <button class="key" data-ch="Т">Т</button>
      <button class="key" data-ch="У">У</button>
    </div>
    <div class="kbrow">
      <button class="key" data-ch="Ф">Ф</button>
      <button class="key" data-ch="Х">Х</button>
      <button class="key" data-ch="Ц">Ц</button>
      <button class="key" data-ch="Ч">Ч</button>
      <button class="key" data-ch="Ш">Ш</button>
    </div>
    <div class="kbrow">
      <button class="key" data-ch="Ы">Ы</button>
      <button class="key" data-ch="І">І</button>
      <button class="key" data-ch="Ю">Ю</button>
      <button class="key" data-ch="Я">Я</button>
    </div>
    <div class="kbrow">
      <button class="key fn" data-ch=".">.</button>
      <button class="key fn" data-ch=",">,</button>
      <button class="key fn" data-ch="?">?</button>
      <button class="key fn" data-ch="!">!</button>
      <button class="key fn wide" data-action="space">␣ БОС ОРЫН</button>
      <button class="key fn wide" data-action="back">⌫ ӨШІРУ</button>
      <button class="key fn danger" data-action="clear">✕</button>
    </div>
  </div>

  <div id="settingsPanel">
    <div id="settingsCard">
      <h2>Баптаулар / Настройки</h2>
      <div class="row2">
        <label>Режим</label>
        <div class="toggle">
          <button id="modeTap" class="active">Түрту</button>
          <button id="modeScan">Сканирование</button>
        </div>
      </div>
      <div class="row2" style="flex-direction:column;align-items:stretch;">
        <label>Жылдамдық (қатар/әріп): <span id="speedVal">1.4</span> сек</label>
        <input type="range" id="speedSlider" min="0.6" max="3" step="0.2" value="1.4">
      </div>
      <button id="closeSettings">Жабу / Закрыть</button>
    </div>
  </div>

</div>

<script>
(function(){
  const output = document.getElementById('output');
  const cancelBtn = document.getElementById('cancelBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const modeTapBtn = document.getElementById('modeTap');
  const modeScanBtn = document.getElementById('modeScan');
  const speedSlider = document.getElementById('speedSlider');
  const speedVal = document.getElementById('speedVal');

  let text = '';
  let mode = 'tap'; // 'tap' | 'scan'
  let speed = 1400;

  const rows = Array.from(document.querySelectorAll('.kbrow'));

  function renderOutput(){
    if(text.length===0){
      output.textContent = 'Мәтін осында шығады...';
      output.classList.add('empty');
    } else {
      output.textContent = text;
      output.classList.remove('empty');
      output.scrollTop = output.scrollHeight;
    }
  }

  function pressKey(keyEl){
    const action = keyEl.dataset.action;
    if(action === 'space'){ text += ' '; }
    else if(action === 'back'){ text = text.slice(0,-1); }
    else if(action === 'clear'){ text = ''; }
    else if(keyEl.dataset.ch){ text += keyEl.dataset.ch; }
    renderOutput();
  }

  // ---- TAP MODE ----
  document.querySelectorAll('.key').forEach(k=>{
    k.addEventListener('click', ()=>{
      if(mode==='tap') pressKey(k);
    });
  });

  // ---- ROW-COLUMN SCAN MODE ----
  let phase = 'idle'; // 'row' | 'col'
  let rowTimer=null, colTimer=null;
  let curRowIdx=0, curColIdx=0;
  let curRowKeys=[];

  function clearHighlights(){
    rows.forEach(r=>r.classList.remove('rowscan'));
    document.querySelectorAll('.key.colscan').forEach(k=>k.classList.remove('colscan'));
  }

  function stopScan(){
    if(rowTimer){clearInterval(rowTimer);rowTimer=null;}
    if(colTimer){clearInterval(colTimer);colTimer=null;}
    clearHighlights();
    phase='idle';
    cancelBtn.classList.remove('show');
  }

  function startRowScan(){
    stopScan();
    if(mode!=='scan') return;
    phase='row';
    curRowIdx=0;
    rows[curRowIdx].classList.add('rowscan');
    rowTimer = setInterval(()=>{
      rows[curRowIdx].classList.remove('rowscan');
      curRowIdx = (curRowIdx+1) % rows.length;
      rows[curRowIdx].classList.add('rowscan');
    }, speed);
  }

  function startColScan(rowIdx){
    if(rowTimer){clearInterval(rowTimer);rowTimer=null;}
    clearHighlights();
    phase='col';
    cancelBtn.classList.add('show');
    curRowKeys = Array.from(rows[rowIdx].querySelectorAll('.key'));
    curColIdx = 0;
    curRowKeys[0].classList.add('colscan');
    colTimer = setInterval(()=>{
      curRowKeys[curColIdx].classList.remove('colscan');
      curColIdx = (curColIdx+1) % curRowKeys.length;
      curRowKeys[curColIdx].classList.add('colscan');
    }, speed);
  }

  function scanSelect(){
    if(phase==='row'){
      startColScan(curRowIdx);
    } else if(phase==='col'){
      const keyEl = curRowKeys[curColIdx];
      if(colTimer){clearInterval(colTimer);colTimer=null;}
      clearHighlights();
      cancelBtn.classList.remove('show');
      pressKey(keyEl);
      startRowScan();
    }
  }

  cancelBtn.addEventListener('click', ()=>{
    if(mode==='scan') startRowScan();
  });

  document.addEventListener('pointerdown', (e)=>{
    if(mode!=='scan') return;
    if(settingsPanel.classList.contains('active')) return;
    if(e.target.closest('#settingsBtn') || e.target.closest('#cancelBtn')) return;
    scanSelect();
  }, {capture:true});

  // ---- SETTINGS ----
  settingsBtn.addEventListener('click', ()=>{
    stopScan();
    settingsPanel.classList.add('active');
  });
  document.getElementById('closeSettings').addEventListener('click', ()=>{
    settingsPanel.classList.remove('active');
    if(mode==='scan') startRowScan();
  });
  modeTapBtn.addEventListener('click', ()=>{
    mode='tap'; modeTapBtn.classList.add('active'); modeScanBtn.classList.remove('active');
    stopScan();
  });
  modeScanBtn.addEventListener('click', ()=>{
    mode='scan'; modeScanBtn.classList.add('active'); modeTapBtn.classList.remove('active');
  });
  speedSlider.addEventListener('input', ()=>{
    speed = parseFloat(speedSlider.value)*1000;
    speedVal.textContent = parseFloat(speedSlider.value).toFixed(1);
    if(mode==='scan'){
      if(phase==='col') startColScan(curRowIdx); else startRowScan();
    }
  });

  renderOutput();
})();
</script>
</body>
</html>
