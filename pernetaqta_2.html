<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Пернетақта</title>
<style>
  :root{
    --bg:#f4f7f7;
    --ink:#1b2a2e;
    --card:#ffffff;
    --key:#2f6f9e;
    --key-d:#22536f;
    --fn:#7a5aa8;
    --fn-d:#5c4285;
    --danger:#c94a3b;
    --muted:#5c6b6f;
    --focus:#ffd23f;
    --rowfocus:#ffe9a6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;
    height:100dvh;
    background:var(--bg);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation; /* disable double-tap-to-zoom */
  }
  #app{
    height:100vh;
    height:100dvh;
    width:100vw;
    display:flex;flex-direction:column;
    min-height:0;
    padding-bottom:env(safe-area-inset-bottom);
    touch-action:manipulation;
  }

  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;flex:0 0 auto;gap:10px;
  }
  #cancelBtn{
    font-size:20px;font-weight:700;
    background:var(--card);border:3px solid #d8dede;border-radius:14px;
    padding:10px 18px;color:var(--ink);visibility:hidden;
    touch-action:manipulation;
  }
  #cancelBtn.show{visibility:visible;}
  #settingsBtn{
    width:46px;height:46px;border-radius:50%;
    background:var(--card);border:3px solid #d8dede;
    font-size:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);
    touch-action:manipulation;
  }

  /* text output */
  #outputWrap{flex:0 0 auto;padding:0 16px 8px;}
  #output{
    background:var(--card);border-radius:20px;
    min-height:90px;max-height:150px;overflow-y:auto;
    padding:16px 20px;
    font-size:42px;font-weight:700;line-height:1.25;
    word-wrap:break-word;
    border:3px solid #d8dede;
  }
  #output.empty{color:#a8b3b5;font-weight:600;font-size:28px;}

  /* page indicator */
  #pageInfo{
    text-align:center;font-size:18px;font-weight:700;color:var(--muted);
    padding:2px 0 6px;flex:0 0 auto;
  }

  /* keyboard grid */
  #kb{
    flex:1;display:flex;flex-direction:column;gap:10px;
    padding:0 12px 12px;
    min-height:0;
  }
  .kbrow{
    display:flex;gap:10px;
    border-radius:16px;
    transition:background .1s;
    touch-action:manipulation;
  }
  .kbrow.rowscan{background:var(--rowfocus);}

  /* row of 3 big letters gets the most vertical space */
  #letterRow{flex:3;}
  #navRow{flex:1.1;}
  #fnRow{flex:1.3;}

  .key{
    margin:0;border:none;border-radius:16px;flex:1;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    background:linear-gradient(180deg,var(--key),var(--key-d));
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    touch-action:manipulation;
  }
  /* Big letter keys */
  #letterRow .key{
    font-size:64px;font-weight:800;
  }
  #letterRow .key.emptyKey{
    background:linear-gradient(180deg,#c9d2d4,#b3bec1);
    box-shadow:none;
    pointer-events:none;
  }

  .key.fn{
    background:linear-gradient(180deg,var(--fn),var(--fn-d));
    font-size:24px;font-weight:800;
  }
  .key.fn.wide{flex:2.4;}
  .key.fn.danger{background:linear-gradient(180deg,var(--danger),#a3392c);}
  .key.colscan{
    outline:7px solid var(--focus);outline-offset:-3px;
    transform:scale(1.04);
  }

  /* settings */
  #settingsPanel{
    display:none;position:absolute;inset:0;z-index:30;
    background:rgba(20,30,32,0.6);align-items:center;justify-content:center;
  }
  #settingsPanel.active{display:flex;}
  #settingsCard{background:#fff;border-radius:26px;padding:30px;width:min(88vw,560px);}
  #settingsCard h2{margin:0 0 20px;font-size:26px;}
  .row2{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:14px;}
  .row2 label{font-size:19px;font-weight:600;}
  .toggle{display:flex;border-radius:16px;overflow:hidden;border:2px solid #d8dede;}
  .toggle button{padding:10px 16px;font-size:16px;font-weight:700;border:none;background:#fff;color:var(--muted);touch-action:manipulation;}
  .toggle button.active{background:var(--key);color:#fff;}
  input[type=range]{width:100%;touch-action:manipulation;}
  #closeSettings{
    margin-top:6px;width:100%;padding:14px;border-radius:14px;border:none;
    background:var(--key);color:#fff;font-size:18px;font-weight:700;
    touch-action:manipulation;
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <button id="cancelBtn">✕ Болдырмау</button>
    <button id="settingsBtn">⚙</button>
  </div>

  <div id="outputWrap">
    <div id="output" class="empty">Мәтін осында шығады...</div>
  </div>

  <div id="pageInfo">Бет <span id="pageCur">1</span> / <span id="pageTotal">1</span></div>

  <div id="kb">
    <div class="kbrow" id="letterRow">
      <button class="key" data-idx="0"></button>
      <button class="key" data-idx="1"></button>
      <button class="key" data-idx="2"></button>
    </div>

    <div class="kbrow" id="navRow">
      <button class="key fn" data-action="prev">◀ Алдыңғы</button>
      <button class="key fn" data-action="next">Келесі ▶</button>
    </div>

    <div class="kbrow" id="fnRow">
      <button class="key fn wide" data-action="space">␣ БОС ОРЫН</button>
      <button class="key fn wide" data-action="back">⌫ ӨШІРУ</button>
      <button class="key fn danger" data-action="clear">✕</button>
    </div>
  </div>

  <div id="settingsPanel">
    <div id="settingsCard">
      <h2>Баптаулар / Настройки</h2>
      <div class="row2">
        <label>Режим</label>
        <div class="toggle">
          <button id="modeTap" class="active">Түрту</button>
          <button id="modeScan">Сканирование</button>
        </div>
      </div>
      <div class="row2" style="flex-direction:column;align-items:stretch;">
        <label>Жылдамдық (қатар/әріп): <span id="speedVal">1.4</span> сек</label>
        <input type="range" id="speedSlider" min="0.6" max="3" step="0.2" value="1.4">
      </div>
      <button id="closeSettings">Жабу / Закрыть</button>
    </div>
  </div>

</div>

<script>
(function(){
  const output = document.getElementById('output');
  const cancelBtn = document.getElementById('cancelBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const modeTapBtn = document.getElementById('modeTap');
  const modeScanBtn = document.getElementById('modeScan');
  const speedSlider = document.getElementById('speedSlider');
  const speedVal = document.getElementById('speedVal');
  const pageCurEl = document.getElementById('pageCur');
  const pageTotalEl = document.getElementById('pageTotal');

  // ---- ALL AVAILABLE CHARACTERS (unchanged from the original keyboard) ----
  const ALL_KEYS = [
    'А','Б','В','Г','Д',
    'Е','Ж','З','И','К',
    'Л','М','Н','О',
    'П','Р','С','Т','У',
    'Ф','Х','Ц','Ч','Ш',
    'Ы','І','Ю','Я',
    '.', ',', '?', '!'
  ];
  const PER_PAGE = 3;
  const TOTAL_PAGES = Math.ceil(ALL_KEYS.length / PER_PAGE);
  let currentPage = 0;

  const letterButtons = Array.from(document.querySelectorAll('#letterRow .key'));

  function renderLetterPage(){
    const start = currentPage * PER_PAGE;
    letterButtons.forEach((btn, i)=>{
      const ch = ALL_KEYS[start + i];
      if(ch){
        btn.textContent = ch;
        btn.dataset.ch = ch;
        btn.classList.remove('emptyKey');
      } else {
        btn.textContent = '';
        delete btn.dataset.ch;
        btn.classList.add('emptyKey');
      }
    });
    pageCurEl.textContent = currentPage + 1;
    pageTotalEl.textContent = TOTAL_PAGES;
  }

  function goPrevPage(){
    currentPage = (currentPage - 1 + TOTAL_PAGES) % TOTAL_PAGES;
    renderLetterPage();
  }
  function goNextPage(){
    currentPage = (currentPage + 1) % TOTAL_PAGES;
    renderLetterPage();
  }

  let text = '';
  let mode = 'tap'; // 'tap' | 'scan'
  let speed = 1400;

  const rows = Array.from(document.querySelectorAll('.kbrow'));

  function renderOutput(){
    if(text.length===0){
      output.textContent = 'Мәтін осында шығады...';
      output.classList.add('empty');
    } else {
      output.textContent = text;
      output.classList.remove('empty');
      output.scrollTop = output.scrollHeight;
    }
  }

  function pressKey(keyEl){
    const action = keyEl.dataset.action;
    if(action === 'space'){ text += ' '; renderOutput(); return; }
    if(action === 'back'){ text = text.slice(0,-1); renderOutput(); return; }
    if(action === 'clear'){ text = ''; renderOutput(); return; }
    if(action === 'prev'){ goPrevPage(); return; }
    if(action === 'next'){ goNextPage(); return; }
    if(keyEl.dataset.ch){ text += keyEl.dataset.ch; renderOutput(); return; }
  }

  // ---- TAP MODE ----
  document.querySelectorAll('.key').forEach(k=>{
    k.addEventListener('click', ()=>{
      if(mode==='tap') pressKey(k);
    });
  });

  // ---- ROW-COLUMN SCAN MODE ----
  let phase = 'idle'; // 'row' | 'col'
  let rowTimer=null, colTimer=null;
  let curRowIdx=0, curColIdx=0;
  let curRowKeys=[];

  function clearHighlights(){
    rows.forEach(r=>r.classList.remove('rowscan'));
    document.querySelectorAll('.key.colscan').forEach(k=>k.classList.remove('colscan'));
  }

  function stopScan(){
    if(rowTimer){clearInterval(rowTimer);rowTimer=null;}
    if(colTimer){clearInterval(colTimer);colTimer=null;}
    clearHighlights();
    phase='idle';
    cancelBtn.classList.remove('show');
  }

  function startRowScan(){
    stopScan();
    if(mode!=='scan') return;
    phase='row';
    curRowIdx=0;
    rows[curRowIdx].classList.add('rowscan');
    rowTimer = setInterval(()=>{
      rows[curRowIdx].classList.remove('rowscan');
      curRowIdx = (curRowIdx+1) % rows.length;
      rows[curRowIdx].classList.add('rowscan');
    }, speed);
  }

  function startColScan(rowIdx){
    if(rowTimer){clearInterval(rowTimer);rowTimer=null;}
    clearHighlights();
    phase='col';
    cancelBtn.classList.add('show');
    // only scan real, selectable keys (skip empty placeholder letter slots)
    curRowKeys = Array.from(rows[rowIdx].querySelectorAll('.key')).filter(k=>!k.classList.contains('emptyKey'));
    if(curRowKeys.length===0){ startRowScan(); return; }
    curColIdx = 0;
    curRowKeys[0].classList.add('colscan');
    colTimer = setInterval(()=>{
      curRowKeys[curColIdx].classList.remove('colscan');
      curColIdx = (curColIdx+1) % curRowKeys.length;
      curRowKeys[curColIdx].classList.add('colscan');
    }, speed);
  }

  function scanSelect(){
    if(phase==='row'){
      startColScan(curRowIdx);
    } else if(phase==='col'){
      const keyEl = curRowKeys[curColIdx];
      if(colTimer){clearInterval(colTimer);colTimer=null;}
      clearHighlights();
      cancelBtn.classList.remove('show');
      pressKey(keyEl);
      startRowScan();
    }
  }

  cancelBtn.addEventListener('click', ()=>{
    if(mode==='scan') startRowScan();
  });

  document.addEventListener('pointerdown', (e)=>{
    if(mode!=='scan') return;
    if(settingsPanel.classList.contains('active')) return;
    if(e.target.closest('#settingsBtn') || e.target.closest('#cancelBtn')) return;
    scanSelect();
  }, {capture:true});

  // ---- SETTINGS ----
  settingsBtn.addEventListener('click', ()=>{
    stopScan();
    settingsPanel.classList.add('active');
  });
  document.getElementById('closeSettings').addEventListener('click', ()=>{
    settingsPanel.classList.remove('active');
    if(mode==='scan') startRowScan();
  });
  modeTapBtn.addEventListener('click', ()=>{
    mode='tap'; modeTapBtn.classList.add('active'); modeScanBtn.classList.remove('active');
    stopScan();
  });
  modeScanBtn.addEventListener('click', ()=>{
    mode='scan'; modeScanBtn.classList.add('active'); modeTapBtn.classList.remove('active');
  });
  speedSlider.addEventListener('input', ()=>{
    speed = parseFloat(speedSlider.value)*1000;
    speedVal.textContent = parseFloat(speedSlider.value).toFixed(1);
    if(mode==='scan'){
      if(phase==='col') startColScan(curRowIdx); else startRowScan();
    }
  });

  // ---- DISABLE DOUBLE-TAP / PINCH ZOOM (tablets) ----
  document.addEventListener('dblclick', function(e){
    e.preventDefault();
  }, {passive:false});

  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouchEnd <= 350){
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, {passive:false});

  document.addEventListener('gesturestart', function(e){
    e.preventDefault();
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(e.scale && e.scale !== 1){ e.preventDefault(); }
  }, {passive:false});

  renderOutput();
  renderLetterPage();
})();
</script>
</body>
</html>
